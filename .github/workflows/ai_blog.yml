name: Tự động tạo bài viết Blog bằng AI & Chờ duyệt

on:
  schedule:
    # Chạy tự động lúc 08:00 sáng giờ VN (01:00 UTC) vào các ngày cách 2 hôm 1 lần
    - cron: '0 1 */2 * *'
  # Cho phép bạn bấm chạy thử nghiệm bất kỳ lúc nào
  workflow_dispatch:

jobs:
  create-post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v4

      - name: Cài đặt Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Cài đặt thư viện AI mới nhất
        run: |
          pip install --upgrade google-generativeai

      - name: Chạy script tạo bài viết AI
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/auto_post_ai.py

      - name: Tạo Pull Request (Bản nháp gửi duyệt)
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "AI Post: Bản nháp bài viết mới cần duyệt"
          title: "📝 [Cần duyệt] Bài viết Blog mới do AI tạo"
          body: |
            Chào Thầy Duy,
            
            Hệ thống AI vừa khởi tạo một bài viết khoa học mới cho mục Blog. 
            
            - **Xem trước:** Bấm vào tab **Files changed** ở trên để đọc nội dung và hình ảnh.
            - **Duyệt bài:** Bấm nút **Merge pull request** để đăng bài lên website.
            - **Hủy bài:** Bấm **Close pull request** nếu chưa ưng ý.
          branch: auto-blog-draft
          delete-branch: true
