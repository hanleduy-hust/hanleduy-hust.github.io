name: Điểm tin khoa học hằng ngày (AI) – gửi email duyệt

on:
  schedule:
    # 06:17 sáng giờ Việt Nam (23:17 UTC hôm trước), mỗi ngày
    - cron: '17 23 * * *'
  # Cho phép bấm "Run workflow" để chạy thử bất kỳ lúc nào
  workflow_dispatch:
    inputs:
      send_email:
        description: 'Gửi email duyệt bài'
        type: boolean
        default: true
      feature_topic:
        description: 'Bài chuyên đề: chủ đề (để trống = bản tin hằng ngày)'
        type: string
        default: ''
      feature_queries:
        description: 'Bài chuyên đề: các truy vấn tìm bài báo (tiếng Anh, cách nhau bằng dấu ;)'
        type: string
        default: ''
      feature_must:
        description: 'Bài chuyên đề: từ khóa bắt buộc (regex, tùy chọn)'
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: ai-blog
  cancel-in-progress: false

jobs:
  create-post:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout mã nguồn
        uses: actions/checkout@v5

      - name: Cài đặt Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Cài đặt thư viện
        run: pip install requests beautifulsoup4 pillow pymupdf

      - name: Thu thập bài báo & viết bản tin bằng AI
        id: gen
        env:
          DRAFT_DIR: ${{ runner.temp }}/draft
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ vars.GEMINI_MODEL }}
          OPENALEX_API_KEY: ${{ secrets.OPENALEX_API_KEY }}
          CONTACT_EMAIL: ${{ secrets.MAIL_USERNAME }}
          FEATURE_TOPIC: ${{ github.event.inputs.feature_topic }}
          FEATURE_QUERIES: ${{ github.event.inputs.feature_queries }}
          FEATURE_MUST: ${{ github.event.inputs.feature_must }}
        run: python scripts/auto_post_ai.py

      - name: Tạo Pull Request bản nháp
        id: cpr
        if: steps.gen.outputs.skipped == 'false'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: auto-blog-draft
          base: main
          delete-branch: true
          add-paths: |
            posts.json
            posts/**
            images/blog/**
          commit-message: "AI Post (nháp): ${{ steps.gen.outputs.title }}"
          title: "📝 [Cần duyệt] ${{ steps.gen.outputs.title }}"
          labels: blog-draft
          body: |
            Bản tin khoa học hằng ngày do AI tổng hợp: **${{ steps.gen.outputs.title }}**

            - **Đọc bản xem trước:** đã gửi qua email (có hình). Hoặc xem tab **Files changed**.
            - **Sửa câu chữ:** Files changed → `posts/${{ steps.gen.outputs.post_id }}.json` → ✏️.
            - **Duyệt & đăng:** bấm **Merge pull request** (bài lên website sau 1–2 phút).
            - **Không đăng:** bấm **Close pull request**.

            Nếu chưa duyệt, bản nháp này sẽ được thay bằng bản tin của ngày hôm sau.

            <details><summary>Nhật ký lấy hình (kỹ thuật)</summary>

            ```
            ${{ steps.gen.outputs.diag }}
            ```
            </details>

      - name: Gửi email duyệt bài
        if: steps.cpr.outputs.pull-request-url != '' && github.event.inputs.send_email != 'false'
        env:
          DRAFT_DIR: ${{ runner.temp }}/draft
          MAIL_USERNAME: ${{ secrets.MAIL_USERNAME }}
          MAIL_APP_PASSWORD: ${{ secrets.MAIL_APP_PASSWORD }}
          MAIL_TO: ${{ secrets.MAIL_TO }}
          PR_URL: ${{ steps.cpr.outputs.pull-request-url }}
        run: python scripts/send_review_email.py
