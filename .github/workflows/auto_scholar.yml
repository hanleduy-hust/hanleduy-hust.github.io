name: Auto Sync Google Scholar

on:
  schedule:
    # Tự động chạy vào 02:00 sáng Chủ Nhật hàng tuần theo giờ UTC
    - cron: '0 2 * * 0'
  workflow_dispatch: # Cho phép bấm nút chạy thử bất cứ lúc nào

permissions:
  contents: write

jobs:
  sync-scholar:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install scholarly

      - name: Run Scholar Scraper
        run: python scripts/update_scholar.py

      - name: Commit and Push updated publications
        run: |
          git config --global user.name "Scholar Bot"
          git config --global user.email "duy.hanle@hust.edu.vn"
          git add scholar_pubs.json
          git commit -m "Auto-update publications from Google Scholar" || exit 0
          git push
