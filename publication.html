<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Công bố khoa học | Publications - TS. Hán Lê Duy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap');
        body { font-family: 'Inter', sans-serif; }
        html[lang="vi"] .lang-en { display: none !important; }
        html[lang="en"] .lang-vi { display: none !important; }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 antialiased">
    <nav class="sticky top-0 z-50 bg-white/95 backdrop-blur border-b border-slate-200 shadow-xs">
        <div class="max-w-6xl mx-auto px-4 sm:px-6 lg:px-8 flex justify-between h-16 items-center">
            <a href="index.html" class="font-bold text-lg text-slate-900">TS. Hán Lê Duy</a>
            <div class="hidden md:flex space-x-5 text-sm font-medium text-slate-600">
                <a href="index.html" class="hover:text-red-700">Trang chủ</a>
                <a href="profile.html" class="hover:text-red-700">Profile</a>
                <a href="research.html" class="hover:text-red-700">Research</a>
                <a href="publication.html" class="text-red-700 font-semibold">Publication</a>
                <a href="teaching.html" class="hover:text-red-700">Teaching</a>
                <a href="blog.html" class="hover:text-red-700">Blog</a>
            </div>
            <div class="flex items-center bg-slate-100 p-1 rounded-lg border border-slate-200">
                <button id="btn-vi" onclick="setLanguage('vi')" class="px-2.5 py-1 text-xs font-bold rounded-md transition bg-red-700 text-white">VI</button>
                <button id="btn-en" onclick="setLanguage('en')" class="px-2.5 py-1 text-xs font-bold rounded-md transition text-slate-600">EN</button>
            </div>
        </div>
    </nav>

    <main class="max-w-5xl mx-auto px-4 sm:px-6 lg:px-8 py-10">
        <section class="bg-white p-6 sm:p-8 rounded-2xl shadow-sm border border-slate-200">
            <div class="flex justify-between items-center mb-6">
                <h1 class="text-lg font-bold text-slate-900 flex items-center gap-2.5">
                    <i class="fa-solid fa-book-journal-whills text-red-700"></i>
                    <span class="lang-vi">Danh mục Công bố Khoa học Quốc tế</span>
                    <span class="lang-en">International Publications</span>
                </h1>
                <a href="https://scholar.google.com/citations?user=VmBCs30AAAAJ&hl=en" target="_blank" class="text-xs font-medium text-blue-600 hover:underline">Google Scholar →</a>
            </div>
            <div id="scholar-pubs-container" class="space-y-4 text-xs">
                <p class="text-slate-400 italic">Đang tải danh mục công bố...</p>
            </div>
        </section>
    </main>

    <footer class="border-t border-slate-200 bg-white mt-12 py-6 text-center text-xs text-slate-500">
        © 2026 TS. Hán Lê Duy — HUST
    </footer>

    <script>
        function setLanguage(lang) {
            document.documentElement.setAttribute('lang', lang);
            localStorage.setItem('preferred_lang', lang);
        }
        document.addEventListener('DOMContentLoaded', () => {
            setLanguage(localStorage.getItem('preferred_lang') || 'vi');
            fetch('scholar_pubs.json')
                .then(res => res.json())
                .then(pubs => {
                    const container = document.getElementById('scholar-pubs-container');
                    container.innerHTML = pubs.map(pub => `
                        <div class="border-l-2 border-red-600 pl-4 py-1">
                            <span class="font-bold text-red-700 bg-red-50 px-2 py-0.5 rounded">${pub.year}</span>
                            <h3 class="text-sm font-semibold text-slate-900 mt-1">${pub.title}</h3>
                            <p class="text-slate-600 mt-0.5">${pub.authors}</p>
                            <p class="italic text-slate-500">${pub.venue}</p>
                            <a href="${pub.url}" target="_blank" class="text-blue-600 hover:underline mt-1 inline-block">[Link DOI / Scholar]</a>
                        </div>
                    `).join('');
                }).catch(() => {
                    document.getElementById('scholar-pubs-container').innerHTML = '<p class="text-xs text-red-500">Chưa tải được dữ liệu scholar_pubs.json</p>';
                });
        });
    </script>
</body>
</html>
